<!DOCTYPE html><html dir="rtl" lang="ar"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "secondary-fixed-dim": "#e6c364",
                    "tertiary": "#000000",
                    "on-primary-container": "#848484",
                    "outline-variant": "#cfc4c5",
                    "primary-fixed": "#e2e2e2",
                    "primary-container": "#1b1b1b",
                    "on-secondary-fixed": "#241a00",
                    "on-primary-fixed": "#1b1b1b",
                    "surface-container": "#eeeeee",
                    "on-error": "#ffffff",
                    "on-error-container": "#93000a",
                    "surface-dim": "#dadada",
                    "outline": "#7e7576",
                    "on-tertiary-container": "#848484",
                    "surface-variant": "#e2e2e2",
                    "surface-container-lowest": "#ffffff",
                    "surface-bright": "#f9f9f9",
                    "primary": "#000000",
                    "primary-fixed-dim": "#c6c6c6",
                    "background": "#f9f9f9",
                    "on-tertiary-fixed": "#1b1b1b",
                    "on-primary": "#ffffff",
                    "on-background": "#1a1c1c",
                    "surface-container-highest": "#e2e2e2",
                    "on-tertiary-fixed-variant": "#474747",
                    "on-secondary-container": "#785d00",
                    "inverse-primary": "#c6c6c6",
                    "error": "#ba1a1a",
                    "surface-tint": "#5e5e5e",
                    "on-tertiary": "#ffffff",
                    "inverse-on-surface": "#f1f1f1",
                    "surface-container-low": "#f3f3f3",
                    "secondary-container": "#fed977",
                    "tertiary-fixed-dim": "#c6c6c6",
                    "surface": "#f9f9f9",
                    "tertiary-container": "#1b1b1b",
                    "on-surface": "#1a1c1c",
                    "tertiary-fixed": "#e2e2e2",
                    "secondary-fixed": "#ffe08f",
                    "inverse-surface": "#2f3131",
                    "on-secondary": "#ffffff",
                    "on-secondary-fixed-variant": "#584400",
                    "on-surface-variant": "#4c4546",
                    "on-primary-fixed-variant": "#474747",
                    "surface-container-high": "#e8e8e8",
                    "secondary": "#755b00",
                    "error-container": "#ffdad6"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "stack-sm": "8px",
                    "gutter": "16px",
                    "stack-md": "16px",
                    "stack-lg": "32px",
                    "safe-area-bottom": "34px",
                    "margin-main": "20px"
            },
            "fontFamily": {
                    "headline-md": ["IBM Plex Sans Arabic"],
                    "display-lg-mobile": ["IBM Plex Sans Arabic"],
                    "body-sm": ["IBM Plex Sans Arabic"],
                    "title-sm": ["IBM Plex Sans Arabic"],
                    "label-caps": ["IBM Plex Sans Arabic"],
                    "display-lg": ["IBM Plex Sans Arabic"],
                    "body-lg": ["IBM Plex Sans Arabic"]
            },
            "fontSize": {
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "display-lg-mobile": ["28px", {"lineHeight": "34px", "fontWeight": "700"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "title-sm": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "600"}],
                    "display-lg": ["34px", {"lineHeight": "42px", "letterSpacing": "-0.5px", "fontWeight": "700"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        .interest-card-active {
            border: 2px solid #000000;
            background-color: #ffffff;
            transform: scale(0.98);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-lg min-h-screen selection:bg-secondary-container">
<!-- Screen Container -->
<main class="max-w-md mx-auto min-h-screen flex flex-col bg-surface overflow-x-hidden relative">
<!-- Step Indicator -->
<header class="pt-8 px-margin-main flex justify-center items-center">
<div class="flex gap-2">
<div class="h-1.5 w-8 rounded-full bg-surface-container-highest"></div>
<div class="h-1.5 w-8 rounded-full bg-surface-container-highest"></div>
<div class="h-1.5 w-12 rounded-full bg-primary transition-all duration-500"></div>
</div>
</header>
<!-- Header Content -->
<section class="mt-stack-lg px-margin-main">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-tight">ما الذي يثير اهتمامك؟</h1>
<p class="font-body-lg text-on-surface-variant mt-2">اختر اهتماماتك لنخصص لك أفضل الفعاليات</p>
</section>
<!-- Interest Selection Grid -->
<section class="mt-stack-lg px-margin-main flex-grow">
<div class="grid grid-cols-2 gap-4">
<!-- Interest Card 1 -->
<button class="group flex flex-col items-center justify-center p-6 bg-surface-container-low rounded-[24px] transition-all duration-300 hover:bg-surface-container-high active:scale-95 border-2 border-transparent" onclick="toggleSelection(this)">
<span class="material-symbols-outlined text-secondary text-4xl mb-3" data-icon="music_note">music_note</span>
<span class="font-title-sm text-title-sm">حفلات ومهرجانات</span>
</button>
<!-- Interest Card 2 -->
<button class="group flex flex-col items-center justify-center p-6 bg-surface-container-low rounded-[24px] transition-all duration-300 hover:bg-surface-container-high active:scale-95 border-2 border-transparent" onclick="toggleSelection(this)">
<span class="material-symbols-outlined text-secondary text-4xl mb-3" data-icon="sports_soccer">sports_soccer</span>
<span class="font-title-sm text-title-sm">رياضة ومغامرات</span>
</button>
<!-- Interest Card 3 -->
<button class="group flex flex-col items-center justify-center p-6 bg-surface-container-low rounded-[24px] transition-all duration-300 hover:bg-surface-container-high active:scale-95 border-2 border-transparent" onclick="toggleSelection(this)">
<span class="material-symbols-outlined text-secondary text-4xl mb-3" data-icon="palette">palette</span>
<span class="font-title-sm text-title-sm">فنون وثقافة</span>
</button>
<!-- Interest Card 4 -->
<button class="group flex flex-col items-center justify-center p-6 bg-surface-container-low rounded-[24px] transition-all duration-300 hover:bg-surface-container-high active:scale-95 border-2 border-transparent" onclick="toggleSelection(this)">
<span class="material-symbols-outlined text-secondary text-4xl mb-3" data-icon="lightbulb">lightbulb</span>
<span class="font-title-sm text-title-sm">محاضرات وورش عمل</span>
</button>
<!-- Interest Card 5 -->
<button class="group flex flex-col items-center justify-center p-6 bg-surface-container-low rounded-[24px] transition-all duration-300 hover:bg-surface-container-high active:scale-95 border-2 border-transparent" onclick="toggleSelection(this)">
<span class="material-symbols-outlined text-secondary text-4xl mb-3" data-icon="restaurant">restaurant</span>
<span class="font-title-sm text-title-sm">طعام وترفيه</span>
</button>
<!-- Interest Card 6 -->
<button class="group flex flex-col items-center justify-center p-6 bg-surface-container-low rounded-[24px] transition-all duration-300 hover:bg-surface-container-high active:scale-95 border-2 border-transparent" onclick="toggleSelection(this)">
<span class="material-symbols-outlined text-secondary text-4xl mb-3" data-icon="sports_esports">sports_esports</span>
<span class="font-title-sm text-title-sm">ترفيه وألعاب</span>
</button>
</div>
<!-- Hint text -->
<p class="text-center font-body-sm text-on-surface-variant mt-stack-lg transition-colors" id="selection-hint">اختر 3 على الأقل</p>
</section>
<!-- Fixed Footer Action -->
<footer class="p-margin-main pb-safe-area-bottom">
<button class="w-full bg-primary text-on-primary h-14 rounded-xl font-headline-md text-headline-md flex items-center justify-center gap-2 opacity-50 cursor-not-allowed transition-all duration-300 active:scale-95" disabled="" id="cta-button">
<span>ابدأ الاستكشاف</span>
<span class="material-symbols-outlined transform rotate-180" data-icon="arrow_forward">arrow_forward</span>
</button>
</footer>
</main>
<script>
        let selectedCount = 0;
        const ctaButton = document.getElementById('cta-button');
        const hintText = document.getElementById('selection-hint');

        function toggleSelection(el) {
            const isActive = el.classList.contains('interest-card-active');
            const icon = el.querySelector('.material-symbols-outlined');
            
            if (isActive) {
                el.classList.remove('interest-card-active');
                el.classList.add('bg-surface-container-low');
                icon.style.fontVariationSettings = "'FILL' 0";
                selectedCount--;
            } else {
                el.classList.add('interest-card-active');
                el.classList.remove('bg-surface-container-low');
                icon.style.fontVariationSettings = "'FILL' 1";
                selectedCount++;
            }

            updateUI();
        }

        function updateUI() {
            if (selectedCount >= 3) {
                ctaButton.disabled = false;
                ctaButton.classList.remove('opacity-50', 'cursor-not-allowed');
                hintText.classList.add('text-secondary');
                hintText.innerText = "رائع! يمكنك الآن الاستمرار";
            } else {
                ctaButton.disabled = true;
                ctaButton.classList.add('opacity-50', 'cursor-not-allowed');
                hintText.classList.remove('text-secondary');
                hintText.innerText = `اختر ${3 - selectedCount} إضافية على الأقل`;
            }
        }
    </script>
</body></html>
