<!DOCTYPE html><html dir="rtl" lang="ar"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "secondary-fixed-dim": "#e6c364",
                    "tertiary": "#000000",
                    "on-primary-container": "#848484",
                    "outline-variant": "#cfc4c5",
                    "primary-fixed": "#e2e2e2",
                    "primary-container": "#1b1b1b",
                    "on-secondary-fixed": "#241a00",
                    "on-primary-fixed": "#1b1b1b",
                    "surface-container": "#eeeeee",
                    "on-error": "#ffffff",
                    "on-error-container": "#93000a",
                    "surface-dim": "#dadada",
                    "outline": "#7e7576",
                    "on-tertiary-container": "#848484",
                    "surface-variant": "#e2e2e2",
                    "surface-container-lowest": "#ffffff",
                    "surface-bright": "#f9f9f9",
                    "primary": "#000000",
                    "primary-fixed-dim": "#c6c6c6",
                    "background": "#f9f9f9",
                    "on-tertiary-fixed": "#1b1b1b",
                    "on-primary": "#ffffff",
                    "on-background": "#1a1c1c",
                    "surface-container-highest": "#e2e2e2",
                    "on-tertiary-fixed-variant": "#474747",
                    "on-secondary-container": "#785d00",
                    "inverse-primary": "#c6c6c6",
                    "error": "#ba1a1a",
                    "surface-tint": "#5e5e5e",
                    "on-tertiary": "#ffffff",
                    "inverse-on-surface": "#f1f1f1",
                    "surface-container-low": "#f3f3f3",
                    "secondary-container": "#fed977",
                    "tertiary-fixed-dim": "#c6c6c6",
                    "surface": "#f9f9f9",
                    "tertiary-container": "#1b1b1b",
                    "on-surface": "#1a1c1c",
                    "tertiary-fixed": "#e2e2e2",
                    "secondary-fixed": "#ffe08f",
                    "inverse-surface": "#2f3131",
                    "on-secondary": "#ffffff",
                    "on-secondary-fixed-variant": "#584400",
                    "on-surface-variant": "#4c4546",
                    "on-primary-fixed-variant": "#474747",
                    "surface-container-high": "#e8e8e8",
                    "secondary": "#755b00",
                    "error-container": "#ffdad6",
                    "tuwaiq-gold": "#C9A84C"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "stack-sm": "8px",
                    "gutter": "16px",
                    "stack-md": "16px",
                    "stack-lg": "32px",
                    "safe-area-bottom": "34px",
                    "margin-main": "20px"
            },
            "fontFamily": {
                    "headline-md": ["IBM Plex Sans Arabic"],
                    "display-lg-mobile": ["IBM Plex Sans Arabic"],
                    "body-sm": ["IBM Plex Sans Arabic"],
                    "title-sm": ["IBM Plex Sans Arabic"],
                    "label-caps": ["IBM Plex Sans Arabic"],
                    "display-lg": ["IBM Plex Sans Arabic"],
                    "body-lg": ["IBM Plex Sans Arabic"]
            },
            "fontSize": {
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "display-lg-mobile": ["28px", {"lineHeight": "34px", "fontWeight": "700"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "title-sm": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "600"}],
                    "display-lg": ["34px", {"lineHeight": "42px", "letterSpacing": "-0.5px", "fontWeight": "700"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            background-color: #ffffff;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .gold-icon {
            font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 48;
        }
        .bento-glow {
            background: radial-gradient(circle at center, rgba(201, 168, 76, 0.05) 0%, transparent 70%);
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center overflow-x-hidden">
<!-- Top AppBar (Back Arrow) -->
<header class="w-full h-16 flex items-center justify-between px-margin-main top-0 sticky z-50 bg-white/80 backdrop-blur-md">
<div class="flex items-center">
<button class="w-10 h-10 flex items-center justify-center rounded-full active:scale-90 transition-transform text-on-surface">
<span class="material-symbols-outlined text-[28px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
<div class="font-headline-md text-headline-md-mobile text-primary"></div>
<div class="w-10"></div> <!-- Spacer -->
</header>
<main class="flex-1 w-full max-w-md px-margin-main flex flex-col items-center justify-center text-center space-y-stack-lg pb-safe-area-bottom">
<!-- Large Gold Outline Email Icon with Atmospheric Glow -->
<div class="relative flex items-center justify-center mb-stack-lg">
<div class="absolute inset-0 bento-glow scale-150 animate-pulse"></div>
<div class="relative w-32 h-32 rounded-full border border-tuwaiq-gold/20 flex items-center justify-center">
<span class="material-symbols-outlined text-[84px] text-tuwaiq-gold gold-icon" data-icon="mail">mail</span>
</div>
</div>
<!-- Title Section -->
<div class="space-y-stack-sm">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-tight">تحقق من بريدك</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px] mx-auto leading-relaxed">
                أرسلنا رابط التفعيل إلى 
                <span class="font-bold text-tuwaiq-gold block mt-1 tracking-wide">user@example.com</span>
</p>
</div>
<!-- Secondary Body Text -->
<div class="bg-surface-container-low p-4 rounded-xl border border-outline-variant/30">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                تحقق من صندوق الوارد أو مجلد الرسائل غير المرغوب فيها
            </p>
</div>
<!-- Action Buttons -->
<div class="w-full space-y-stack-md pt-stack-md">
<!-- Primary Button -->
<button class="w-full h-14 bg-primary text-on-primary rounded-xl font-title-sm text-title-sm flex items-center justify-center shadow-md active:scale-95 transition-all duration-200">
                فتح تطبيق البريد
            </button>
<!-- Resend Link -->
<div class="flex flex-col items-center space-y-stack-sm pt-4">
<button class="flex items-center gap-1 group">
<span class="font-body-lg text-body-lg text-on-surface-variant">لم تستلم الرسالة؟</span>
<span class="font-body-lg text-body-lg text-tuwaiq-gold font-bold group-active:opacity-70 transition-opacity">إعادة الإرسال</span>
</button>
<!-- Change Email Link -->
<button class="font-label-caps text-label-caps text-on-surface-variant/60 hover:text-on-surface transition-colors">
                    تغيير البريد الإلكتروني
                </button>
</div>
</div>
</main>
<!-- Visual Decoration (Asymmetric Soft Shapes) -->
<div class="fixed top-20 -left-20 w-64 h-64 bg-secondary-fixed-dim/5 rounded-full blur-3xl pointer-events-none"></div>
<div class="fixed bottom-10 -right-20 w-80 h-80 bg-tuwaiq-gold/5 rounded-full blur-3xl pointer-events-none"></div>
<script>
        // Micro-interaction for the button
        document.querySelector('.bg-primary').addEventListener('click', function() {
            this.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="refresh">refresh</span>';
            setTimeout(() => {
                this.innerHTML = 'فتح تطبيق البريد';
            }, 2000);
        });

        // Subtle parallax or float effect on the icon
        document.addEventListener('mousemove', (e) => {
            const iconContainer = document.querySelector('.relative.w-32.h-32');
            const x = (window.innerWidth / 2 - e.pageX) / 40;
            const y = (window.innerHeight / 2 - e.pageY) / 40;
            iconContainer.style.transform = `translate(${x}px, ${y}px)`;
        });
    </script>
</body></html>
