<!DOCTYPE html><html dir="rtl" lang="ar"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "secondary-fixed-dim": "#e6c364",
                    "tertiary": "#000000",
                    "on-primary-container": "#848484",
                    "outline-variant": "#cfc4c5",
                    "primary-fixed": "#e2e2e2",
                    "primary-container": "#1b1b1b",
                    "on-secondary-fixed": "#241a00",
                    "on-primary-fixed": "#1b1b1b",
                    "surface-container": "#eeeeee",
                    "on-error": "#ffffff",
                    "on-error-container": "#93000a",
                    "surface-dim": "#dadada",
                    "outline": "#7e7576",
                    "on-tertiary-container": "#848484",
                    "surface-variant": "#e2e2e2",
                    "surface-container-lowest": "#ffffff",
                    "surface-bright": "#f9f9f9",
                    "primary": "#000000",
                    "primary-fixed-dim": "#c6c6c6",
                    "background": "#f9f9f9",
                    "on-tertiary-fixed": "#1b1b1b",
                    "on-primary": "#ffffff",
                    "on-background": "#1a1c1c",
                    "surface-container-highest": "#e2e2e2",
                    "on-tertiary-fixed-variant": "#474747",
                    "on-secondary-container": "#785d00",
                    "inverse-primary": "#c6c6c6",
                    "error": "#ba1a1a",
                    "surface-tint": "#5e5e5e",
                    "on-tertiary": "#ffffff",
                    "inverse-on-surface": "#f1f1f1",
                    "surface-container-low": "#f3f3f3",
                    "secondary-container": "#fed977",
                    "tertiary-fixed-dim": "#c6c6c6",
                    "surface": "#ffffff",
                    "tertiary-container": "#1b1b1b",
                    "on-surface": "#1a1c1c",
                    "tertiary-fixed": "#e2e2e2",
                    "secondary-fixed": "#ffe08f",
                    "inverse-surface": "#2f3131",
                    "on-secondary": "#ffffff",
                    "on-secondary-fixed-variant": "#584400",
                    "on-surface-variant": "#4c4546",
                    "on-primary-fixed-variant": "#474747",
                    "surface-container-high": "#e8e8e8",
                    "secondary": "#C9A84C",
                    "error-container": "#ffdad6"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "12px",
                    "2xl": "16px",
                    "full": "9999px"
            },
            "spacing": {
                    "stack-sm": "8px",
                    "gutter": "16px",
                    "stack-md": "16px",
                    "stack-lg": "32px",
                    "safe-area-bottom": "34px",
                    "margin-main": "20px"
            },
            "fontFamily": {
                    "headline-md": ["IBM Plex Sans Arabic"],
                    "display-lg-mobile": ["IBM Plex Sans Arabic"],
                    "body-sm": ["IBM Plex Sans Arabic"],
                    "title-sm": ["IBM Plex Sans Arabic"],
                    "label-caps": ["IBM Plex Sans Arabic"],
                    "display-lg": ["IBM Plex Sans Arabic"],
                    "body-lg": ["IBM Plex Sans Arabic"]
            },
            "fontSize": {
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "display-lg-mobile": ["28px", {"lineHeight": "34px", "fontWeight": "700"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "title-sm": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "600"}],
                    "display-lg": ["34px", {"lineHeight": "42px", "letterSpacing": "-0.5px", "fontWeight": "700"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        body {
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .input-focus-effect:focus-within {
            box-shadow: 0 0 0 1.5px #000000;
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- Login screen is a focused transactional journey; navigation shell suppressed per mandate -->
<main class="flex-grow flex flex-col px-margin-main pt-12 pb-safe-area-bottom max-w-md mx-auto w-full">
<!-- Top Center Logo -->
<div class="flex justify-center mb-stack-lg">
<img alt="Tuwaiq Logo" class="h-24 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA19htGz-3Us5OscjrB29ogEmjcJjfsqzOxZHgkscv3auDe3g0zZajjl2WKcFvmqsg_FPQ3LzUEvTs4dMvQx7iEoZnzQ2AmNzh8l8B37xbXvpah8bZqUS4ySPHzty4ROmxqbcItUTHSq77XFulJq-tuGDO-c71JXAbdqdvHh49cZ0D8zAB-Su4ui7nExAlrlfZe-t2kbAtpAT3NL1EGiA_Oab1cjpNc_4zBviATGKbJ9-vMrPgL80BjMiKxyKPnqQko5XGsOUlG-KI">
</div>
<!-- Title & Subtitle Section -->
<div class="text-right mb-stack-lg">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary mb-2">مرحباً بعودتك</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">سجّل دخولك للمتابعة</p>
</div>
<!-- Form Section -->
<form class="space-y-6" onsubmit="return false;">
<!-- Email Field -->
<div class="space-y-2">
<label class="block font-title-sm text-body-sm text-right pr-2" for="email">البريد الإلكتروني</label>
<div class="relative flex items-center bg-surface-container-low rounded-2xl h-14 px-4 input-focus-effect transition-all border border-transparent">
<input class="w-full bg-transparent border-none focus:ring-0 text-right font-body-lg placeholder:text-on-surface-variant/50" id="email" placeholder="example@domain.com" type="email">
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="block font-title-sm text-body-sm text-right pr-2" for="password">كلمة المرور</label>
<div class="relative flex items-center bg-surface-container-low rounded-2xl h-14 px-4 input-focus-effect transition-all border border-transparent">
<!-- Eye Icon on Left for RTL -->
<button class="text-on-surface-variant hover:text-primary transition-colors pr-2" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="password-toggle-icon">visibility</span>
</button>
<input class="w-full bg-transparent border-none focus:ring-0 text-right font-body-lg placeholder:text-on-surface-variant/50" id="password" placeholder="••••••••" type="password">
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end">
<a class="text-secondary font-title-sm text-body-sm hover:opacity-80 transition-opacity" href="#">
                    نسيت كلمة المرور؟
                </a>
</div>
<!-- Primary Action -->
<button class="w-full h-[56px] bg-primary text-on-primary rounded-xl font-headline-md text-headline-md active:scale-95 transition-transform flex items-center justify-center" type="submit">
                تسجيل الدخول
            </button>
</form>
<!-- Divider -->
<div class="relative my-stack-lg">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center">
<span class="bg-surface px-4 text-on-surface-variant font-body-sm">أو</span>
</div>
</div>
<!-- Secondary Action -->
<button class="w-full h-[56px] border border-primary text-primary rounded-xl font-headline-md text-headline-md active:scale-95 transition-transform hover:bg-surface-container-low flex items-center justify-center" type="button">
            إنشاء حساب جديد
        </button>
</main>
<!-- Decorative Subtle Accent -->
<div class="fixed bottom-0 left-0 w-32 h-32 bg-secondary opacity-5 blur-[100px] pointer-events-none"></div>
<div class="fixed top-0 right-0 w-48 h-48 bg-primary opacity-5 blur-[120px] pointer-events-none"></div>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const icon = document.getElementById('password-toggle-icon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        // Simple button interaction feedback
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('touchstart', function() {
                this.classList.add('opacity-80');
            });
            button.addEventListener('touchend', function() {
                this.classList.remove('opacity-80');
            });
        });
    </script>
</body></html>
