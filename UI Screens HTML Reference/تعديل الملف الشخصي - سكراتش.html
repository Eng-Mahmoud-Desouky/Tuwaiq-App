<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>

                    "fontFamily": {

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        input:focus, textarea:focus {
            box-shadow: 0 0 0 2px #00ffff !important;
            outline: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body-md antialiased min-h-screen flex flex-col items-center">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface dark:bg-surface-dim shadow-sm flex items-center justify-between px-margin-mobile md:px-margin-desktop h-16 z-50 shadow-[0px_4px_12px_rgba(0,0,0,0.03)]">
<button aria-label="Cancel" class="text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 transition-transform p-2 -ml-2">
<span class="font-label-lg text-label-lg">Cancel</span>
</button>
<h1 class="font-title-md text-title-md text-on-surface">Edit Profile</h1>
<button aria-label="Save" class="text-[#00ffff] font-label-lg text-label-lg font-bold hover:opacity-80 transition-opacity active:scale-95 transition-transform p-2 -mr-2">
            Save
        </button>
</header>
<!-- Main Content -->
<main class="w-full max-w-2xl px-margin-mobile md:px-margin-desktop py-lg flex-1 flex flex-col gap-lg">
<!-- Avatar Section -->
<section class="flex flex-col items-center gap-sm">
<div class="relative group cursor-pointer active:scale-95 transition-transform">
<img alt="Profile Avatar" class="w-32 h-32 rounded-full object-cover shadow-[0px_8px_24px_rgba(0,0,0,0.06)]" data-alt="A close-up portrait of a young person smiling softly. The lighting is bright and modern, creating a clean, welcoming aesthetic suitable for a tech or social app profile picture. The background is slightly blurred to keep focus on the subject." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBGQFfnDvuoC7vSw6SNlbOvdTWddQ19RoMPPfSNH947QzJKJDKSMTPX9ql4eq9yIZf0MlopZ1_Z_hrcKuC-Z0ktE71tDwRxxpUI4WYqPpcs5bnROxW7USBnF0PwmxW7JVQIrZzugvQIeoWxZ1meRD1bimdzfcgCLpbONLEdx0B9v9WUNYc1k-8Dj2Mv_98pFeeQlGnNuv4tyLQNP5dprYFQG1ItVN7m7m4NUO-mkDyzyuy4vsnHqXve4GIfcLXsX1KvBx1SNO9h7aE"/>
<div class="absolute inset-0 bg-black/40 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined filled text-white text-3xl" data-icon="photo_camera">photo_camera</span>
</div>
</div>
<button class="text-primary font-label-sm text-label-sm hover:underline active:scale-95 transition-transform">Change Photo</button>
</section>
<!-- Form Section -->
<section class="flex flex-col gap-md bg-surface p-6 rounded-2xl shadow-[0px_8px_24px_rgba(0,0,0,0.06)]">
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="fullName">Full Name</label>
<input class="w-full bg-surface-variant border-none rounded-xl px-4 py-3 font-body-md text-on-surface placeholder:text-outline-variant transition-all" id="fullName" type="text" value="Alex Morgan"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="username">Username</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant">@</span>
<input class="w-full bg-surface-variant border-none rounded-xl pl-8 pr-4 py-3 font-body-md text-on-surface placeholder:text-outline-variant transition-all" id="username" type="text" value="alexm_creates"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="bio">Bio</label>
<textarea class="w-full bg-surface-variant border-none rounded-xl px-4 py-3 font-body-md text-on-surface placeholder:text-outline-variant transition-all resize-none" id="bio" rows="4">Digital creator &amp; tech enthusiast. Building the future, one pixel at a time. ⚡️</textarea>
<div class="text-right text-xs text-outline-variant mt-1">82 / 160</div>
</div>
</section>
<!-- Interests Section -->
<section class="flex flex-col gap-sm bg-surface p-6 rounded-2xl shadow-[0px_8px_24px_rgba(0,0,0,0.06)] mb-xl md:mb-0">
<h2 class="font-title-md text-title-md text-on-surface">Interests</h2>
<div class="flex flex-wrap gap-2 mt-2">
<!-- Existing Interests -->
<div class="flex items-center gap-1 bg-primary-container/20 text-on-primary-container px-3 py-1.5 rounded-full font-label-sm text-label-sm">
                    Design
                    <button aria-label="Remove Design" class="hover:text-error transition-colors"><span class="material-symbols-outlined text-[16px]" data-icon="close">close</span></button>
</div>
<div class="flex items-center gap-1 bg-primary-container/20 text-on-primary-container px-3 py-1.5 rounded-full font-label-sm text-label-sm">
                    Technology
                    <button aria-label="Remove Technology" class="hover:text-error transition-colors"><span class="material-symbols-outlined text-[16px]" data-icon="close">close</span></button>
</div>
<div class="flex items-center gap-1 bg-primary-container/20 text-on-primary-container px-3 py-1.5 rounded-full font-label-sm text-label-sm">
                    Fintech
                    <button aria-label="Remove Fintech" class="hover:text-error transition-colors"><span class="material-symbols-outlined text-[16px]" data-icon="close">close</span></button>
</div>
<!-- Add Interest -->
<button class="flex items-center gap-1 border border-dashed border-outline-variant text-on-surface-variant hover:border-primary hover:text-primary px-3 py-1.5 rounded-full font-label-sm text-label-sm transition-colors active:scale-95">
<span class="material-symbols-outlined text-[16px]" data-icon="add">add</span>
                    Add Interest
                </button>
</div>
</section>
</main>
<!-- Navigation shell suppressed for modal/edit view as per guidelines -->
</body></html>
