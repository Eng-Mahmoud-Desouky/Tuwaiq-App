                        "background": "#f9f9f9",

                        "on-secondary-container": "#785d00",

                        "error": "#ba1a1a",
                        "surface-tint": "#5e5e5e",
                        "on-tertiary": "#ffffff",
                        "inverse-on-surface": "#f1f1f1",
                        "surface-container-low": "#f3f3f3",
                        "secondary-container": "#fed977",
                        "tertiary-fixed-dim": "#c6c6c6",
                        "surface": "#f9f9f9",
                        "tertiary-container": "#1b1b1b",
                        "on-surface": "#1a1c1c",
                        "tertiary-fixed": "#e2e2e2",
                        "secondary-fixed": "#ffe08f",
                        "inverse-surface": "#2f3131",
                        "on-secondary": "#ffffff",
                        "on-secondary-fixed-variant": "#584400",
                        "on-surface-variant": "#4c4546",

                    "spacing": {

                        "gutter": "16px",
                        "stack-md": "16px",

                    },

                    "fontSize": {

<style>
        body {
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            background-color: #ffffff;
            color: #1a1c1c;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .input-focus-effect:focus-within {
            border-bottom: 1.5px solid #000000;
        }
        .strength-bar {
            height: 4px;
            transition: width 0.3s ease, background-color 0.3s ease;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center overflow-x-hidden">
<!-- Top Navigation Bar (Implicitly based on TopAppBar shell) -->
<header class="w-full h-16 flex items-center justify-between px-margin-main bg-white sticky top-0 z-50">
<button aria-label="رجوع" class="w-10 h-10 flex items-center justify-center active:scale-95 transition-transform">
<span class="material-symbols-outlined text-primary">arrow_forward</span>
</button>
<div class="flex-1 flex justify-center">
<img alt="Tuwaiq Logo" class="h-8 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA19htGz-3Us5OscjrB29ogEmjcJjfsqzOxZHgkscv3auDe3g0zZajjl2WKcFvmqsg_FPQ3LzUEvTs4dMvQx7iEoZnzQ2AmNzh8l8B37xbXvpah8bZqUS4ySPHzty4ROmxqbcItUTHSq77XFulJq-tuGDO-c71JXAbdqdvHh49cZ0D8zAB-Su4ui7nExAlrlfZe-t2kbAtpAT3NL1EGiA_Oab1cjpNc_4zBviATGKbJ9-vMrPgL80BjMiKxyKPnqQko5XGsOUlG-KI">
</div>
<div class="w-10"></div> <!-- Spacer for symmetry -->
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-md px-margin-main pb-safe-area-bottom flex flex-col gap-stack-lg">
<!-- Header Section -->
<section class="mt-stack-md">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary text-right mb-2">إنشاء حساب</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant text-right">انضم إلى مجتمع طويق</p>
</section>
<!-- Registration Form -->
<form class="flex flex-col gap-stack-md" onsubmit="event.preventDefault();">
<!-- Full Name -->
<div class="group">
<input class="w-full h-14 px-4 bg-surface-container-low border-none rounded-xl font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant/50 focus:ring-0 focus:bg-surface-container-high transition-colors" placeholder="الاسم الكامل" type="text">
</div>
<!-- Username with prefix -->
<div class="group relative flex items-center">
<span class="absolute left-4 font-body-lg text-on-surface-variant select-none">@</span>
<input class="w-full h-14 pl-10 pr-4 bg-surface-container-low border-none rounded-xl font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant/50 focus:ring-0 focus:bg-surface-container-high transition-colors" placeholder="اسم المستخدم" type="text">
</div>
<!-- Email -->
<div class="group">
<input class="w-full h-14 px-4 bg-surface-container-low border-none rounded-xl font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant/50 focus:ring-0 focus:bg-surface-container-high transition-colors" placeholder="البريد الإلكتروني" type="email">
</div>
<!-- Password & Strength -->
<div class="group flex flex-col gap-2">
<div class="relative">
<input class="w-full h-14 px-4 bg-surface-container-low border-none rounded-xl font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant/50 focus:ring-0 focus:bg-surface-container-high transition-colors" id="password-input" placeholder="كلمة المرور" type="password">
<button class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
<!-- Strength Bar -->
<div class="w-full bg-surface-container rounded-full h-1 overflow-hidden">
<div class="strength-bar w-1/4 bg-error" id="strength-meter"></div>
</div>
</div>
<!-- Confirm Password -->
<div class="group">
<input class="w-full h-14 px-4 bg-surface-container-low border-none rounded-xl font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant/50 focus:ring-0 focus:bg-surface-container-high transition-colors" placeholder="تأكيد كلمة المرور" type="password">
</div>
<!-- Action Button -->
<button class="w-full h-14 mt-stack-md bg-primary text-on-primary rounded-xl font-title-sm text-title-sm active:scale-[0.98] transition-transform shadow-sm flex items-center justify-center">
                إنشاء الحساب
            </button>
</form>
<!-- Secondary Actions & Login Link -->
<footer class="flex flex-col items-center gap-stack-md mt-4">
<p class="font-body-sm text-body-sm text-on-surface">
                لديك حساب بالفعل؟ 
                <a class="text-secondary-fixed-dim font-bold hover:underline" href="#">تسجيل الدخول</a>
</p>
<div class="flex items-center gap-4 w-full opacity-50 py-4">
<div class="flex-1 h-[1px] bg-outline-variant"></div>

<div class="flex-1 h-[1px] bg-outline-variant"></div>
</div>

</footer>
</main>
<!-- Success Feedback Overlay (Hidden by default) -->
<div class="fixed inset-0 bg-white z-[100] flex flex-col items-center justify-center p-margin-main opacity-0 pointer-events-none transition-opacity duration-500" id="success-feedback">
<div class="w-24 h-24 bg-secondary-fixed-dim rounded-full flex items-center justify-center mb-stack-lg scale-50 transition-transform duration-700 delay-100">
<span class="material-symbols-outlined text-on-secondary-fixed text-5xl" style="font-variation-settings: &quot;FILL&quot; 1;">check_circle</span>
</div>
<h2 class="font-headline-md text-headline-md text-primary mb-2">تم إنشاء الحساب!</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant text-center">مرحباً بك في عالم طويق الحصري</p>
</div>
<script>
        // Simple micro-interaction for password strength
        const passwordInput = document.getElementById('password-input');
        const strengthMeter = document.getElementById('strength-meter');

        passwordInput.addEventListener('input', (e) => {
            const val = e.target.value;
            if (val.length === 0) {
                strengthMeter.style.width = '0%';
                strengthMeter.className = 'strength-bar bg-error';
            } else if (val.length < 6) {
                strengthMeter.style.width = '33%';
                strengthMeter.className = 'strength-bar bg-error';
            } else if (val.length < 10) {
                strengthMeter.style.width = '66%';
                strengthMeter.className = 'strength-bar bg-secondary-fixed-dim';
            } else {
                strengthMeter.style.width = '100%';
                strengthMeter.className = 'strength-bar bg-primary';
            }
        });

        // Toggle Password Visibility
        const toggleBtn = passwordInput.nextElementSibling;
        toggleBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            toggleBtn.querySelector('span').textContent = type === 'password' ? 'visibility' : 'visibility_off';
        });

        // Registration Animation Mockup
        document.querySelector('button.bg-primary').addEventListener('click', () => {
            const overlay = document.getElementById('success-feedback');
            overlay.classList.remove('opacity-0', 'pointer-events-none');
            overlay.classList.add('opacity-100');
            overlay.querySelector('div').classList.remove('scale-50');
            overlay.querySelector('div').classList.add('scale-100');
            
            setTimeout(() => {
                // Mock redirect after 3 seconds
                window.scrollTo({top: 0, behavior: 'smooth'});
            }, 3000);
        });
    </script>


</body></html>
